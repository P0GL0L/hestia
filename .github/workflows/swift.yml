name: Swift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift 6
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Run tests
        run: |
          set -eu
          if [ ! -f Package.swift ]; then
            echo "Skipping swift test: Package.swift does not exist yet."
            exit 0
          fi
          swift test

  macos:
    name: swift test (macos, package only)
    runs-on: macos-15
    env:
      # Leaves the HestiaApp target out of the package (see Package.swift). The app is built on the owner's Mac.
      HESTIA_PACKAGE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

  swiftlint:
    name: swiftlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned SwiftLint image. New findings fail; the ones recorded in .swiftlint-baseline.json do not.
      - name: Lint
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.57.1 \
            swiftlint lint --strict --baseline .swiftlint-baseline.json
